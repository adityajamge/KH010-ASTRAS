<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  body { margin: 0; background: #fbfcfd; }
  a { color: oklch(0.58 0.13 232); }
  a:hover { color: oklch(0.48 0.13 232); }
  @keyframes dropWaveDrift { from { transform: translateX(0); } to { transform: translateX(-160px); } }
  @keyframes dropWaveDriftB { from { transform: translateX(-160px); } to { transform: translateX(0); } }
  @keyframes dropWaveRise { 0%, 100% { transform: translateY(3px); } 50% { transform: translateY(-3px); } }
  @keyframes nodePulse { 0%, 100% { opacity: 0.4; transform: scale(0.82); } 50% { opacity: 1; transform: scale(1.2); } }
  @keyframes linkFlow { from { stroke-dashoffset: 48; } to { stroke-dashoffset: 0; } }
  @keyframes ringSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes ringSpinBack { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
  @keyframes rippleOut { 0% { transform: scale(0.68); opacity: 0; } 15% { opacity: 1; } 100% { transform: scale(1.2); opacity: 0; } }
  @keyframes sheen { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.6; } }
</style>
</helmet>
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 48px 24px; box-sizing: border-box; background: #fbfcfd;">
  <svg viewBox="-12 -4 224 224" width="280" height="280" style="overflow: visible; display: block;" role="img" aria-label="Animated water drop AI logo">
    <defs>
      <clipPath id="dropClip">
        <path d="M100 26 C100 26 152 82 152 116 A52 52 0 1 1 48 116 C48 82 100 26 100 26 Z" />
      </clipPath>
      <linearGradient id="waveA" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="oklch(0.74 0.12 230)" />
        <stop offset="100%" stop-color="oklch(0.56 0.13 250)" />
      </linearGradient>
      <linearGradient id="waveB" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="oklch(0.8 0.09 268)" />
        <stop offset="100%" stop-color="oklch(0.68 0.11 258)" />
      </linearGradient>
    </defs>

    <sc-if value="{{ showRipple }}" hint-placeholder-val="{{ true }}">
      <g>
        <circle cx="100" cy="112" r="78" fill="none" stroke="oklch(0.62 0.13 238)" stroke-width="5" style="transform-origin: 100px 112px; animation: rippleOut 4.2s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;" />
        <circle cx="100" cy="112" r="78" fill="none" stroke="oklch(0.62 0.13 238)" stroke-width="5" style="transform-origin: 100px 112px; animation: rippleOut 4.2s cubic-bezier(0.22, 0.61, 0.36, 1) infinite 1.4s;" />
        <circle cx="100" cy="112" r="78" fill="none" stroke="oklch(0.62 0.13 238)" stroke-width="5" style="transform-origin: 100px 112px; animation: rippleOut 4.2s cubic-bezier(0.22, 0.61, 0.36, 1) infinite 2.8s;" />
      </g>
    </sc-if>

    <circle cx="100" cy="112" r="72" fill="none" stroke="oklch(0.6 0.12 240)" stroke-width="5" stroke-linecap="round" stroke-dasharray="5 20" style="transform-origin: 100px 112px; animation: ringSpin 16s linear infinite;" />
    <circle cx="100" cy="112" r="64" fill="none" stroke="oklch(0.55 0.14 272)" stroke-width="6" stroke-linecap="round" stroke-dasharray="70 332" style="transform-origin: 100px 112px; animation: ringSpinBack 9s linear infinite;" />
    <g style="transform-origin: 100px 112px; animation: ringSpin 6s linear infinite;">
      <circle cx="100" cy="40" r="6.5" fill="oklch(0.5 0.14 250)" />
    </g>
    <g style="transform-origin: 100px 112px; animation: ringSpinBack 9s linear infinite;">
      <circle cx="164" cy="112" r="5" fill="oklch(0.62 0.13 285)" />
    </g>

    <path d="M100 26 C100 26 152 82 152 116 A52 52 0 1 1 48 116 C48 82 100 26 100 26 Z" fill="oklch(0.975 0.01 238)" />

    <g clip-path="url(#dropClip)">
      <g style="animation: dropWaveRise 7s ease-in-out infinite;">
        <path d="M-60 100 C-40 94 -20 94 0 100 S40 106 80 100 S120 94 160 100 S200 106 240 100 S280 94 320 100 V200 H-60 Z" fill="url(#waveB)" opacity="0.45" style="animation: dropWaveDriftB 11s linear infinite;" />
      </g>
      <g style="animation: dropWaveRise 5.5s ease-in-out infinite 0.7s;">
        <path d="M-60 106 C-40 100 -20 100 0 106 S40 112 80 106 S120 100 160 106 S200 112 240 106 S280 100 320 106 V200 H-60 Z" fill="url(#waveA)" style="animation: dropWaveDrift 8s linear infinite;" />
      </g>
      <path d="M74 52 C64 66 60 78 61 90" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" style="animation: sheen 5.4s ease-in-out infinite;" />
    </g>

    <sc-if value="{{ showNeural }}" hint-placeholder-val="{{ true }}">
      <g clip-path="url(#dropClip)">
        <g fill="none" stroke="oklch(0.5 0.12 246)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 6" opacity="0.9">
          <line x1="100" y1="66" x2="74" y2="102" style="animation: linkFlow 2.4s linear infinite;" />
          <line x1="100" y1="66" x2="126" y2="102" style="animation: linkFlow 2.4s linear infinite 0.3s;" />
          <line x1="74" y1="102" x2="126" y2="102" style="animation: linkFlow 2.4s linear infinite 0.6s;" />
          <line x1="74" y1="102" x2="100" y2="138" style="animation: linkFlow 2.4s linear infinite 0.9s;" />
          <line x1="126" y1="102" x2="100" y2="138" style="animation: linkFlow 2.4s linear infinite 1.2s;" />
        </g>
        <g fill="#ffffff" stroke="oklch(0.46 0.12 246)" stroke-width="1.4">
          <circle cx="100" cy="66" r="5.5" style="transform-origin: 100px 66px; animation: nodePulse 3.2s ease-in-out infinite;" />
          <circle cx="74" cy="102" r="5.5" style="transform-origin: 74px 102px; animation: nodePulse 3.2s ease-in-out infinite 0.8s;" />
          <circle cx="126" cy="102" r="5.5" style="transform-origin: 126px 102px; animation: nodePulse 3.2s ease-in-out infinite 1.6s;" />
          <circle cx="100" cy="138" r="5.5" style="transform-origin: 100px 138px; animation: nodePulse 3.2s ease-in-out infinite 2.4s;" />
        </g>
      </g>
    </sc-if>

    <path d="M100 26 C100 26 152 82 152 116 A52 52 0 1 1 48 116 C48 82 100 26 100 26 Z" fill="none" stroke="oklch(0.45 0.11 244)" stroke-width="3" stroke-linejoin="round" />
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showRipple&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Animation&quot;},&quot;showNeural&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Animation&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      showRipple: this.props.showRipple ?? true,
      showNeural: this.props.showNeural ?? true
    };
  }
}
</script>
</body>
</html>
