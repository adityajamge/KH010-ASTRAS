<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Irrigation Network — Digital Twin</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; background: #efece4; }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { display: block; width: 100vw; height: 100vh; }
  #legend {
    position: fixed; left: 18px; bottom: 18px; z-index: 5;
    font: 400 12px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #2a2c29; background: rgba(247,245,239,0.92);
    border: 1px solid #d6d1c4; border-radius: 10px; padding: 12px 14px;
    display: grid; gap: 7px; max-width: 236px;
  }
  #legend h1 { margin: 0 0 2px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
  #legend p { margin: 0; color: #6e6a60; }
  .row { display: flex; align-items: center; gap: 8px; }
  .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  a, a:hover { color: #2f6f8f; }
</style>
</head>
<body>
<three-d-stage name="irrigation-network" background="#efece4"></three-d-stage>
<div id="legend">
  <h1>Irrigation network twin</h1>
  <p>Reservoir → main canal → 5 distributaries → 10 farm plots. Drag to orbit, scroll to zoom.</p>
  <div class="row"><span class="sw" style="background:#2f8f4e"></span>Full allocation</div>
  <div class="row"><span class="sw" style="background:#d4941c"></span>Seepage / disputed turn</div>
  <div class="row"><span class="sw" style="background:#be3b2a"></span>Blocked / tail shortage</div>
  <div class="row"><span class="sw" style="background:#b49a74"></span>Dry channel bed</div>
  <p>Contour ribbons mark 0.45 m elevation steps; the head reach sits 2.9 m above the tail.</p>
</div>
<script src="./three-d-stage.js"></script>
<script type="module" src="./irrigation-model.js"></script>
</body>
</html>
